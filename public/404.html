<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>D Ensured Consult Academy - Redirecting...</title>
  <script>
    // SPA 404 Fallback for Vercel, Netlify, GitHub Pages, and Static Hosts
    // Seamlessly handles direct browser refreshes on routes like /admin
    (function() {
      var pathname = window.location.pathname || '';
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      // If user refreshed on /admin or subpaths, preserve route
      if (pathname === '/admin' || pathname.startsWith('/admin/')) {
        window.location.replace('/#' + pathname + (search ? '?' + search.slice(1) : '') + hash);
      } else {
        window.location.replace('/#' + pathname + (search ? '?' + search.slice(1) : '') + hash);
      }
    })();
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b1329; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <div style="text-align: center; padding: 24px;">
    <div style="width: 44px; height: 44px; border: 3px solid #0284c7; border-top-color: transparent; border-radius: 50%; margin: 0 auto 16px; animation: decSpin 0.9s linear infinite;"></div>
    <h1 style="font-size: 19px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em;">D Ensured Consult Academy</h1>
    <p style="font-size: 13px; color: #94a3b8; margin: 0;">Loading secure dashboard portal...</p>
  </div>
  <style>
    @keyframes decSpin { to { transform: rotate(360deg); } }
  </style>
</body>
</html>
